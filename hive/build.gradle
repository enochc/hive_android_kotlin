plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.enochc.hive'
    compileSdk 36

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// The Rust half isn't built by Gradle. Without it the app would build and
// then fail at runtime with an UnsatisfiedLinkError, so stop here instead.
def nativeLibs = fileTree(dir: 'src/main/jniLibs', include: '**/libhive.so')
tasks.register('checkNativeLibs') {
    doLast {
        if (nativeLibs.isEmpty()) {
            throw new GradleException(
                'hive/src/main/jniLibs has no libhive.so. Build it from the hive crate with ./build-native.sh (see README.md).')
        }
    }
}
preBuild.dependsOn 'checkNativeLibs'

dependencies {
    // StateFlow is part of HiveClient's API.
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'

    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
